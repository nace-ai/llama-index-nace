name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [llama-index-selectors-nace, llama-index-evaluation-nace]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages --all-groups
      - run: uv run ruff check packages/${{ matrix.package }} scripts
      - run: uv run ruff format --check packages/${{ matrix.package }} scripts
      - run: uv run mypy
      - run: uv run python scripts/check_drex_sync.py
      - run: >
          uv run pytest packages/${{ matrix.package }}/tests
          --rootdir packages/${{ matrix.package }}
          --cov --cov-config packages/${{ matrix.package }}/pyproject.toml
      - run: uv build --package ${{ matrix.package }}

  deps:
    name: deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lowest, python: "3.11", sdk: "==0.3.0", core: "==0.14.0", httpx: "==0.27.0", pydantic: "==2.11.5" }
          - { name: nace-sdk-0.4.0, python: "3.12", sdk: "==0.4.0", core: ">=0.14.0,<0.15", httpx: ">=0.27,<1", pydantic: ">=2.11,<3" }
          - { name: nace-sdk-0.6.0, python: "3.13", sdk: "==0.6.0", core: ">=0.14.0,<0.15", httpx: ">=0.27,<1", pydantic: ">=2.11,<3" }
          - { name: newest, python: "3.14", sdk: ">=0.3.0,<1.0.0", core: ">=0.14.0,<0.15", httpx: ">=0.27,<1", pydantic: ">=2.11,<3" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests of both packages against these versions
        run: |
          set -euo pipefail
          run() {
            uv run --isolated --no-project --python "${{ matrix.python }}" \
              --with-editable packages/llama-index-selectors-nace \
              --with-editable packages/llama-index-evaluation-nace \
              --with "nace-sdk${{ matrix.sdk }}" --with "llama-index-core${{ matrix.core }}" \
              --with "httpx${{ matrix.httpx }}" --with "pydantic${{ matrix.pydantic }}" \
              --with "pytest>=8.3" --with "pytest-asyncio>=0.25" --with "pillow>=11.0" -- "$@"
          }
          run python -c "from importlib.metadata import version as v; print({p: v(p) for p in ['nace-sdk','llama-index-core','httpx','pydantic']})"
          for p in llama-index-selectors-nace llama-index-evaluation-nace; do
            run pytest "packages/$p/tests" --rootdir "packages/$p" -p no:cacheprovider
          done
      - if: matrix.name == 'newest'
        name: Types against the newest SDK
        run: uv sync --all-packages --all-groups && uv run --with "nace-sdk${{ matrix.sdk }}" mypy
