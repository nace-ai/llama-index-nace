[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-evaluation-nace"
description = "LlamaIndex evaluators backed by Drex decision models from Nace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dynamic = ["version"]
authors = [{ name = "Nace AI", email = "hello@nace.ai" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.14.0,<0.15",
    "nace-sdk>=0.3.0,<1.0.0",
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://console.nace.ai/docs"
Repository = "https://github.com/nace-ai/llama-index-nace"
Issues = "https://github.com/nace-ai/llama-index-nace/issues"

[tool.hatch.version]
path = "llama_index/evaluation/nace/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.hatch.build.targets.sdist]
include = ["llama_index", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Drex API (needs NACE_API_KEY_LIVE)"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["llama_index.evaluation.nace"]
omit = ["*/_drex/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
