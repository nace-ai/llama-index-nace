[project]
name = "llama-index-nace-workspace"
version = "0.0.0"
description = "Workspace root for the Nace LlamaIndex integrations (not published)"
requires-python = ">=3.11,<4.0"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
llama-index-selectors-nace = { workspace = true }
llama-index-evaluation-nace = { workspace = true }

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pillow>=11.0",
]
benchmark = [
    "llama-index-llms-anthropic>=0.8",
    "llama-index-llms-openai>=0.5",
]
lint = ["ruff>=0.14", "mypy>=1.18"]
docs = ["jupyter>=1.1", "nbconvert>=7.16", "ipykernel>=6.29"]
dev = [
    "llama-index-selectors-nace",
    "llama-index-evaluation-nace",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF", "SIM", "PT", "TC", "ANN", "D"]
ignore = ["D203", "D213", "D401", "D105", "D107", "ANN401", "S101", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "ANN", "S", "PT011"]
"examples/**" = ["D", "S", "T201"]
"scripts/**" = ["D", "S", "T201"]
"benchmark/**" = ["T201", "ANN", "D", "S", "BLE001"]

[tool.mypy]
strict = true
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/llama-index-selectors-nace", "packages/llama-index-evaluation-nace"]
files = [
    "packages/llama-index-selectors-nace/llama_index",
    "packages/llama-index-evaluation-nace/llama_index",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nace_sdk.*"]
follow_imports = "normal"
